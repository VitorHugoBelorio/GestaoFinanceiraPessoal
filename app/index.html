<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contorno ajuda você a organizar receitas e despesas, entender seus saldos e decidir melhor o próximo passo." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('gestao-financeira-theme')
          const theme = storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch { /* O React aplica o tema padrão na inicialização. */ }
      })()
    </script>
    <title>Contorno — Controle financeiro pessoal</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
